services:
  # Este es el nombre del servicio para tu API de Python
  taxtech-api:
    build: .
    container_name: api-soberana-python
    # Mapea el puerto 8000 de tu código al puerto 8000 de tu PC
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://host.docker.internal:11434
    restart: always
    networks:
      - red-privada-soberana
    depends_on:
      - qdrant

  # Este es el servicio de n8n (la herramienta de automatización)
  n8n-automation:
    image: n8nio/n8n:latest
    container_name: n8n-local
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    # Esto guarda tus automatizaciones aunque apagues el PC
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - red-privada-soberana
    # Indica que primero se debe encender tu API de Python
    depends_on:
      - taxtech-api

  # Base de Datos Vectorial para RAG Local y Soberanía del Dato
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-soberano
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - red-privada-soberana

networks:   
  # Crea una red interna para que el código no salga a internet si no quieres
  red-privada-soberana:
    driver: bridge

volumes:
  n8n_data:
  qdrant_data:
